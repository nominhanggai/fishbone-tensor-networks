[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishbonett"
version = "0.1.0"
description = "Tensor-network dynamics of open quantum systems coupled to harmonic baths."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The fishbonett developers" }]
maintainers = [{ name = "Hanggai Nuomin", email = "hanggai@caltech.edu" }]
keywords = [
    "tensor networks",
    "matrix product states",
    "open quantum systems",
    "spin-boson model",
    "TEDOPA",
    "electron transfer",
    "vibronic dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "opt_einsum>=3.3",
]

[project.optional-dependencies]
rates = ["vegas>=5.0"]
test = ["pytest>=7"]
docs = ["sphinx>=6", "furo", "myst-parser", "matplotlib>=3.5"]
dev = ["pytest>=7", "build", "twine", "ruff"]
gpu-cuda11 = ["cupy-cuda11x>=12"]
gpu-cuda12 = ["cupy-cuda12x>=12"]

[project.urls]
Homepage = "https://github.com/nominhanggai/fishbone-tensor-networks"
Repository = "https://github.com/nominhanggai/fishbone-tensor-networks"
Issues = "https://github.com/nominhanggai/fishbone-tensor-networks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fishbonett"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codex-jobs",
    "/.github",
    "/.private",
    "/.tmp-*",
    "/.venv",
    "/dist",
    "/examples/legacy",
    "/extensions",
    "/legacy",
    "/paper",
    "/tmp",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Keep SciPy's sparse-array transition visible if an old call site returns.
    "error:.*kron is switching to the sparse array interface.*:DeprecationWarning",
]
