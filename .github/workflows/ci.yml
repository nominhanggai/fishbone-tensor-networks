name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src tests examples benchmarks docs/figures.py conftest.py

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run test suite
        run: pytest -q

  minimum-dependencies:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install declared dependency floors
        run: |
          python -m pip install "numpy==1.22.4" "scipy==1.8.1" "opt_einsum==3.3.0" "pytest>=7"
          python -m pip install -e . --no-deps
      - run: pytest -q

  package:
    name: build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel outside the checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -c "import fishbonett; print(fishbonett.__version__)"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*

  smoke:
    # Keep runnable examples and exact-diagonalization benchmarks in the release
    # gate even though they are not imported by the unit suite.
    name: examples + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run the curated examples
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: Run the benchmarks
        run: |
          set -e
          for f in benchmarks/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  docs-figures:
    name: tutorial figure (${{ matrix.figure }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        figure:
          - vibronic_dimer
          - nonadiabatic_spin_boson
          - bridge_electron_transfer
          - two_bath_heat_flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Generate tutorial figure
        run: python docs/figures.py --figure "${{ matrix.figure }}"
      - name: Upload generated figure and summary
        uses: actions/upload-artifact@v6
        with:
          name: docs-figure-${{ matrix.figure }}
          path: |
            docs/img/*.svg
            docs/_generated/*.md
          if-no-files-found: error

  docs:
    name: docs (strict build)
    needs: docs-figures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Download generated tutorial figures
        uses: actions/download-artifact@v6
        with:
          pattern: docs-figure-*
          path: docs
          merge-multiple: true
      - name: Build docs (generates remaining figures; warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload rendered docs
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-pages:
    name: deploy docs to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
