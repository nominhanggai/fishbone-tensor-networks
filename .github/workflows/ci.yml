name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Tutorial figures are production calculations. Ordinary pushes reuse the
  # last ones built; this is when they are rebuilt and the site is published.
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src tests examples benchmarks docs/figures.py conftest.py

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test] pytest-github-actions-annotate-failures
      - name: Run test suite
        run: pytest -q

  minimum-dependencies:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install declared dependency floors
        run: |
          python -m pip install "numpy==1.22.4" "scipy==1.8.1" "opt_einsum==3.3.0" "pytest>=7" pytest-github-actions-annotate-failures
          python -m pip install -e . --no-deps
      - run: pytest -q

  package:
    name: build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel outside the checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -c "import fishbonett; print(fishbonett.__version__)"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*

  smoke:
    # Keep runnable examples and exact-diagonalization benchmarks in the release
    # gate even though they are not imported by the unit suite.
    name: examples + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run the curated examples
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: Run the benchmarks
        run: |
          set -e
          for f in benchmarks/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  docs-figures:
    name: tutorial figure (${{ matrix.figure }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        figure:
          - vibronic_dimer
          - nonadiabatic_spin_boson
          - bridge_electron_transfer
          - two_bath_heat_flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # These are production calculations, not smoke plots: the vibronic dimer
      # reproduces a published figure and took 151.6 minutes of one run against
      # a 180 minute timeout. The exact key lists what docs/figures.py already
      # treats as a figure's inputs, so an exact hit means the generator would
      # have skipped the work anyway. The prefix leaves the most recent figure
      # available to build the documentation against when the inputs did move.
      - name: Restore the generated figure
        id: figure-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/img
            docs/_generated
          key: docs-figure-${{ matrix.figure }}-${{ hashFiles('docs/figures.py', format('examples/{0}.py', matrix.figure), 'examples/reference_data/**', 'src/fishbonett/**/*.py') }}
          restore-keys: docs-figure-${{ matrix.figure }}-
      - name: Decide whether to rebuild
        id: plan
        env:
          FULL_BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          EXACT_HIT: ${{ steps.figure-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.figure-cache.outputs.cache-matched-key }}
          FIGURE: ${{ matrix.figure }}
        run: |
          if [ "$EXACT_HIT" = "true" ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          elif [ "$FULL_BUILD" = "true" ] || [ -z "$MATCHED_KEY" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tutorial figure $FIGURE reused::Its inputs changed, but this run does not rebuild figures. The documentation is built against the last one produced. A scheduled or dispatched run refreshes it and publishes the site."
          fi
      - name: Install package with docs extras
        if: steps.plan.outputs.rebuild == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Generate tutorial figure
        if: steps.plan.outputs.rebuild == 'true'
        run: |
          set +e
          python docs/figures.py --figure "${{ matrix.figure }}" > figure.log 2>&1
          status=$?
          cat figure.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 figure.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Tutorial figure ${{ matrix.figure }} failed::$message"
          fi
          exit "$status"
      # Only store what this run actually produced. Saving a reused figure
      # under the new key would mark stale work as current for these inputs.
      - name: Save the generated figure
        if: steps.plan.outputs.rebuild == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            docs/img
            docs/_generated
          key: docs-figure-${{ matrix.figure }}-${{ hashFiles('docs/figures.py', format('examples/{0}.py', matrix.figure), 'examples/reference_data/**', 'src/fishbonett/**/*.py') }}
      - name: Upload generated figure and summary
        uses: actions/upload-artifact@v6
        with:
          name: docs-figure-${{ matrix.figure }}
          path: |
            docs/img/*.svg
            docs/_generated/*.md
          if-no-files-found: error

  docs:
    name: docs (strict build)
    needs: docs-figures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Download generated tutorial figures
        uses: actions/download-artifact@v6
        with:
          pattern: docs-figure-*
          path: docs
          merge-multiple: true
      - name: Build docs (generates remaining figures; warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload rendered docs
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-pages:
    name: deploy docs to GitHub Pages
    # Publish only from a run that rebuilt the tutorial figures, so the site
    # never shows one carried over from an earlier state of the package.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
