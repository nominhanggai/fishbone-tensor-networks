name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run test suite
        run: pytest -q

  smoke:
    # The unit suite does not import examples/ or benchmarks/, so nothing was
    # stopping them from rotting.  benchmarks/tree_engine.py did: it had been
    # failing at import for some time, in three independent ways, each a caller
    # left behind by an earlier API generalization.  Nobody noticed because
    # nothing ran it.  These are also the only checks that validate the engines
    # against exact diagonalization outside the test suite, so they are worth
    # keeping alive.
    name: examples + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        # `speed` (opt_einsum) matters here: the tree engines are markedly slower
        # on numpy's einsum, and the benchmarks exercise them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,speed]
      - name: Run the curated examples
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: Run the benchmarks
        # They print measured errors against exact diagonalization; a non-zero exit
        # means one of them stopped working, which is what this job is for.
        run: |
          set -e
          for f in benchmarks/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  docs:
    name: docs (build + figures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Build docs (regenerates the figures, warnings are errors)
        # docs/conf.py calls docs/figures.py, so the figures in docs/img are
        # produced here rather than committed to the repository.
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
