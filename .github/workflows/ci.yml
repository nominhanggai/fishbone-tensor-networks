name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        # Deliberately without `speed`: this matrix covers the NumPy contraction
        # fallback, which is what a plain `pip install fishbonett` gives you.
        # The opt_einsum path is covered by the `test-opt-einsum` job below.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run test suite
        run: pytest -q

  test-opt-einsum:
    # `speed` is the configuration the docs recommend, and until this job existed
    # the unit suite never ran with it: the matrix above installs only [test], so
    # every CI run exercised the NumPy fallback and nothing exercised opt_einsum.
    # The two agree to within one ULP (measured across the whole method table), and
    # test_both_contraction_backends_agree pins that -- but it skips unless both
    # backends are present, so without this job it never actually ran anywhere.
    name: tests (opt_einsum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the speed extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,speed]
      - name: Run test suite on the opt_einsum backend
        run: pytest -q
      - name: Run test suite on the NumPy backend for comparison
        # Same install, both paths -- so a divergence shows up as one job failing
        # two ways rather than as a mystery difference between jobs.
        run: pytest -q
        env:
          FISHBONETT_EINSUM: numpy

  minimum-dependencies:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install declared dependency floors
        run: |
          python -m pip install "numpy==1.22.4" "scipy==1.8.1" "pytest>=7"
          python -m pip install -e . --no-deps
      - run: pytest -q

  package:
    name: build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel outside the checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -c "import fishbonett; print(fishbonett.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  smoke:
    # The unit suite does not import examples/ or benchmarks/, so nothing was
    # stopping them from rotting.  benchmarks/tree_engine.py did: it had been
    # failing at import for some time, in three independent ways, each a caller
    # left behind by an earlier API generalization.  Nobody noticed because
    # nothing ran it.  These are also the only checks that validate the engines
    # against exact diagonalization outside the test suite, so they are worth
    # keeping alive.
    name: examples + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        # `speed` (opt_einsum) matters here: the tree engines are markedly slower
        # on numpy's einsum, and the benchmarks exercise them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,speed]
      - name: Run the curated examples
        run: |
          set -e
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: Run the benchmarks
        # They print measured errors against exact diagonalization; a non-zero exit
        # means one of them stopped working, which is what this job is for.
        run: |
          set -e
          for f in benchmarks/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  docs:
    name: docs (build + figures)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs,speed]
      - name: Build docs (regenerates the figures, warnings are errors)
        # docs/conf.py calls docs/figures.py, so the figures in docs/img are
        # produced here rather than committed to the repository.
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
